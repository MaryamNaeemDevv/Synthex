<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Synthex Lite</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #0f172a; color: #e2e8f0; font-family: 'Inter', sans-serif; }
        .card { background-color: #1e293b; border: none; color: #f1f5f9; }
        .btn-primary { background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%); border: none; }
        .navbar { background-color: #1e293b !important; }
        .nav-link { color: #94a3b8 !important; }
        .nav-link:hover { color: #f1f5f9 !important; }
        .table { color: #e2e8f0; }
        .table-striped tbody tr:nth-of-type(odd) { background-color: rgba(255,255,255,0.05); }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">SYNTHEX <span class="text-primary">LITE</span></a>
            <div class="navbar-nav ms-auto" th:if="${username != null}">
                <span class="nav-item nav-link text-light">Welcome, <span th:text="${username}">User</span></span>
                <a class="nav-item nav-link" href="/logout">Logout</a>
            </div>
        </div>
    </nav>
    <div class="container">
        <div th:replace="${content}"></div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
