<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: html(content=~{::section})}">
<section>
    <div class="row justify-content-center">
        <div class="col-md-4">
            <div class="card p-4 shadow-lg">
                <h2 class="text-center mb-4">Register</h2>
                <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
                <form action="/register" method="post">
                    <div class="mb-3">
                        <label class="form-label">Username</label>
                        <input type="text" name="username" class="form-control bg-dark text-white border-secondary" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" name="email" class="form-control bg-dark text-white border-secondary" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" name="password" class="form-control bg-dark text-white border-secondary" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2">Create Account</button>
                </form>
                <div class="mt-3 text-center">
                    <p class="small text-muted">Already have an account? <a href="/login" class="text-primary">Login here</a></p>
                </div>
            </div>
        </div>
    </div>
</section>
</html>
