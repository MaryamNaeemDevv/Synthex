<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: html(content=~{::section})}">
<section>
    <div class="row">
        <!-- Sidebar / Menu -->
        <div class="col-md-3">
            <div class="card p-3 mb-4">
                <h5 class="mb-3">Actions</h5>
                <div class="d-grid gap-2">
                    <button class="btn btn-primary btn-lg mb-2" disabled>Play Session (Coming Soon)</button>
                    <form action="/sync" method="post">
                        <button type="submit" class="btn btn-outline-info w-100 mb-2">Sync Data</button>
                    </form>
                    <div th:if="${message}" class="alert alert-success py-1 mt-2 small" th:text="${message}"></div>
                </div>
            </div>
            
            <div class="card p-3">
                <h5 class="mb-3">Personal Best</h5>
                <div class="text-center">
                    <h2 class="text-primary" th:text="${history.size() > 0 ? history[0].score : 0}">0</h2>
                    <p class="text-muted small">Current highscore</p>
                </div>
            </div>
        </div>

        <!-- Leaderboard & History -->
        <div class="col-md-9">
            <div class="card p-4 mb-4">
                <h4 class="mb-4">Global Leaderboard</h4>
                <div class="table-responsive">
                    <table class="table table-dark table-striped">
                        <thead>
                            <tr>
                                <th>User</th>
                                <th class="text-end">Score</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="entry : ${leaderboard}">
                                <td th:text="${entry.username}">User</td>
                                <td class="text-end fw-bold text-primary" th:text="${entry.score}">0</td>
                            </tr>
                            <tr th:if="${leaderboard.isEmpty()}">
                                <td colspan="2" class="text-center text-muted">No entries yet</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="card p-4">
                <h4 class="mb-4">Performance History</h4>
                <div class="table-responsive">
                    <table class="table table-dark table-striped">
                        <thead>
                            <tr>
                                <th>Score</th>
                                <th>Fails</th>
                                <th>Difficulty</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="stat : ${history}">
                                <td th:text="${stat.score}">0</td>
                                <td th:text="${stat.codeFails}">0</td>
                                <td th:text="${stat.highestDifficultyLevel}">1</td>
                            </tr>
                            <tr th:if="${history.isEmpty()}">
                                <td colspan="3" class="text-center text-muted">No games played yet</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</section>
</html>
